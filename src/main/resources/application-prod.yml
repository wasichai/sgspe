# perfil de producción (architecture.md §10.2, ADR-0020 y ADR-0026). ProdProfileTest lo fija
wasichai:
  database:
    # sin valor por defecto, como el secreto: sin la variable la app no arranca y nunca cae en el sgspe/sgspe de desarrollo
    host: ${WASICHAI_DB_HOST}
    port: ${WASICHAI_DB_PORT:5432}
    name: ${WASICHAI_DB_NAME}
    username: ${WASICHAI_DB_USERNAME}
    password: ${WASICHAI_DB_PASSWORD}
  seed:
    # nunca el admin@wasichai.local de desarrollo
    dev: false
  organizations:
    # UPS-10 (WAS-ADR-0055, ASM-109): crear y borrar tenants exige MANAGE_TENANTS, que solo tiene el rol ADMIN de la
    # organización operadora, sembrado fuera de banda antes de desplegar (docs/develop/README.md). el ADMIN de un cliente
    # conserva usuarios, roles, cuentas de servicio y el nombre de su tenant
    separate-provisioning: true
  security:
    jwt:
      # obligatorio y sin valor por defecto: sin WASICHAI_JWT_SECRET (>= 32 bytes) la app no arranca
      secret: ${WASICHAI_JWT_SECRET}
      # menos que las 8 horas por defecto (RQ-SEC-001); el despliegue puede acortarlo, nunca llevarlo a 8 h o más
      ttl: PT4H
      # UPS-09 (WAS-ADR-0059): un token anterior a la marca del usuario se rechaza (deshabilitar, cambiar roles o clave,
      # cerrar sesión). la caché por usuario acota cuánto tarda otra réplica en enterarse
      revocation: true
      revocation-cache: PT5S
    login:
      # 5 intentos por correo y dirección, 20 por correo desde cualquier dirección, en ventanas de 15 minutos; pasado el
      # límite responde 429 con Retry-After. el proxy conserva su propio límite como defensa extra (RQ-SEC-015)
      enabled: true
      max-attempts: 5
      account-max-attempts: 20
      window: PT15M
    password:
      min-length: 12
      require-uppercase: true
      require-lowercase: true
      require-digit: true
      require-symbol: true
      not-equal-email: true
  files:
    # las evidencias en un servicio compatible con S3, nunca en el disco de una réplica (ADR-0014). sin bucket la app no
    # arranca (ProdGuard); el endpoint vacío usa el de AWS. las claves no se declaran: sin WASICHAI_FILES_S3_ACCESS_KEY y
    # WASICHAI_FILES_S3_SECRET_KEY rige la cadena de credenciales del SDK (rol de instancia); con una sola, ProdGuard falla
    store: s3
    s3:
      bucket: ${WASICHAI_FILES_S3_BUCKET:}
      endpoint: ${WASICHAI_FILES_S3_ENDPOINT:}
      path-style-access: ${WASICHAI_FILES_S3_PATH_STYLE_ACCESS:false}
  gis:
    geoserver:
      # ADR-0015 y security.md §10.2: GeoServer en la red interna, con las credenciales y los hosts del despliegue, nunca
      # los de desarrollo ni los de wasichai (admin/geoserver). apagado si el despliegue no lo enciende: el backend funciona
      # sin GeoServer y el proxy WMS responde 503. ProdProfileTest lo fija
      enabled: ${WASICHAI_GIS_GEOSERVER_ENABLED:false}
      url: ${WASICHAI_GIS_GEOSERVER_URL:}
      username: ${WASICHAI_GIS_GEOSERVER_USERNAME:}
      password: ${WASICHAI_GIS_GEOSERVER_PASSWORD:}
      workspace: sgspe
      datastore:
        # el rol de solo lectura del despliegue (security.md §10.2, regla 6)
        name: sgspe-postgis
        host: ${WASICHAI_GIS_GEOSERVER_DATASTORE_HOST:}
        port: ${WASICHAI_GIS_GEOSERVER_DATASTORE_PORT:5432}
        database: ${WASICHAI_GIS_GEOSERVER_DATASTORE_DATABASE:}
        username: ${WASICHAI_GIS_GEOSERVER_DATASTORE_USERNAME:}
        password: ${WASICHAI_GIS_GEOSERVER_DATASTORE_PASSWORD:}

spring:
  mail:
    # el servidor SMTP lo nombra el despliegue (el de desarrollo es Mailpit en localhost); ProdGuard lo exige con el correo
    # encendido
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}

server:
  # el despliegue siempre está detrás del proxy inverso (ADR-0026): sin esto remoteAddress es la del proxy y el límite de
  # intentos de login (wasichai.security.login) cuenta a todos los clientes como uno. exige que el proxy sobrescriba, nunca
  # agregue, X-Forwarded-For y X-Forwarded-Proto (architecture.md §10.2)
  forward-headers-strategy: framework

logging:
  structured:
    format:
      # json ECS en la consola, sin datos personales (RNF-OBS-001, RQ-SEC-010)
      console: ecs
