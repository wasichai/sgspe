server:
  port: 8094

spring:
  application:
    name: sgspe
  mail:
    # el canal de correo de wasichai-notifications (GAP-021): Mailpit de compose.yml en desarrollo, por el túnel
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1029}
  webflux:
    multipart:
      # los multipart son la importación (api.md §4.2) y la subida de una evidencia (POST /api/objects/evidence/files/file).
      # Spring guarda en disco la parte de archivo antes de entregarla: sin tope llenaría el disco antes de que
      # ImportController o wasichai-files cuenten los bytes. es igual a wasichai.files.max-bytes y a
      # sgspe.territory.import.max-bytes (20 MB, P52): Spring cuenta solo los bytes del contenido y rechaza los que pasan el
      # tope, así que un archivo de 20 MB exactos entra; uno más grande lo corta Spring y UploadLimits responde
      # 400 FILE_TOO_LARGE sobre file, con código, en las dos rutas. si se sube un máximo, se suben los tres
      max-disk-usage-per-part: 20MB
      # la confirmación usa 7 partes y, con GDAL, 8 (layer): 8 acota el disco que una petición puede ocupar (8 × 20 MB)
      max-parts: 8
      # las decisiones de una hoja de 10 000 filas pasan de los 256 KB por defecto
      max-in-memory-size: 1MB

wasichai:
  database:
    host: ${WASICHAI_DB_HOST:localhost}
    # compose.yml publica PostGIS en 127.0.0.1:5435 del VPS y llega por el túnel ssh. nunca 5432 ni 5434: son de otras apps
    port: ${WASICHAI_DB_PORT:5435}
    name: ${WASICHAI_DB_NAME:sgspe}
    username: ${WASICHAI_DB_USERNAME:sgspe}
    password: ${WASICHAI_DB_PASSWORD:sgspe}
  metadata:
    cache:
      # cuánto guarda cada nodo una definición de objeto (ADR-066 de wasichai). en el mismo nodo un cambio del modelo la
      # borra al instante; este valor es la ventana en otro nodo, la de security.md §9.7. 0s lee siempre de la base
      ttl: 30s
  gis:
    geoserver:
      # GeoServer de F6 (ADR-0015, compose.yml). apagado por defecto: /api/gis/layers lista las capas con published=false
      # sin llamarlo. encendido, wasichai publica por la API REST de GeoServer (POST /api/gis/layers, que llama
      # model/publish_layers.py) en el GeoServer del compose, por el túnel del puerto 8095. las credenciales de desarrollo
      # son las del compose; producción no tiene valores por defecto (application-prod.yml)
      enabled: ${WASICHAI_GIS_GEOSERVER_ENABLED:false}
      url: ${WASICHAI_GIS_GEOSERVER_URL:http://localhost:8095/geoserver}
      username: ${WASICHAI_GIS_GEOSERVER_USERNAME:sgspe}
      password: ${WASICHAI_GIS_GEOSERVER_PASSWORD:sgspe-geoserver}
      workspace: sgspe
      datastore:
        # cómo llega GeoServer (no la app) a PostGIS: por la red del compose (postgis:5432), con el rol de solo lectura
        # sgspe_geoserver (security.md §10.2, regla 6), que se crea una vez en la base (docs/develop/README.md)
        name: sgspe-postgis
        host: ${WASICHAI_GIS_GEOSERVER_DATASTORE_HOST:postgis}
        port: ${WASICHAI_GIS_GEOSERVER_DATASTORE_PORT:5432}
        database: ${WASICHAI_GIS_GEOSERVER_DATASTORE_DATABASE:sgspe}
        username: ${WASICHAI_GIS_GEOSERVER_DATASTORE_USERNAME:sgspe_geoserver}
        password: ${WASICHAI_GIS_GEOSERVER_DATASTORE_PASSWORD:sgspe-geoserver-lectura}
  seed:
    # admin@wasichai.local / admin. solo para desarrollo: application-prod.yml lo apaga
    dev: ${WASICHAI_SEED_DEV:true}
  security:
    jwt:
      # solo para desarrollo. producción exige WASICHAI_JWT_SECRET (>= 32 bytes) sin valor por defecto (application-prod.yml)
      secret: ${WASICHAI_JWT_SECRET:sgspe-dev-only-secret-change-me-0123456789}
  files:
    # D1 (ADR-0014, WAS-ADR-0061): el campo FILE de evidence. local guarda en una carpeta (una sola réplica, sin compose);
    # s3 usa el MinIO de compose.yml en desarrollo y un servicio compatible con S3 en producción (application-prod.yml)
    store: ${WASICHAI_FILES_STORE:local}
    # tope de un archivo, el mismo de las importaciones (RQ-SEC-020) y de max-disk-usage-per-part de Spring (P52)
    max-bytes: 20MB
    local:
      path: ${WASICHAI_FILES_LOCAL_PATH:build/wasichai-files}
    s3:
      bucket: ${WASICHAI_FILES_S3_BUCKET:sgspe-evidencias}
      endpoint: ${WASICHAI_FILES_S3_ENDPOINT:http://localhost:9095}
      region: ${WASICHAI_FILES_S3_REGION:us-east-1}
      # access-key y secret-key sin valor por defecto: para el MinIO de compose.yml, develop/.env (example.env); sin ellas
      # rige la cadena de credenciales del SDK
      # MinIO pide URL con la ruta del bucket; AWS S3 acepta las dos
      path-style-access: ${WASICHAI_FILES_S3_PATH_STYLE_ACCESS:true}
  agent:
    # el asistente de solo lectura (AI-05, ai-architecture.md §8). la clave llega solo por ANTHROPIC_API_KEY, que lee EmbabelGate;
    # sin ella Embabel queda fuera y /api/sgspe/ai/** responde 503 AI_UNAVAILABLE. el modelo es el más capaz del catálogo de
    # Embabel 1.5.3, que no conoce los Claude 5 (ASM-129): cuando los sume, se cambia aquí
    model: claude-opus-4-8
  notifications:
    # D2 (ADR-0018, WAS-ADR-0046 y 0060): bandeja, SSE y correo. el día de las reglas de fecha empieza en Lima
    zone: America/Lima
    email:
      # GAP-021: el servidor de prueba de compose.yml (Mailpit) en desarrollo; apagado si no se define
      enabled: ${WASICHAI_NOTIFICATIONS_EMAIL_ENABLED:false}
      from: ${WASICHAI_NOTIFICATIONS_EMAIL_FROM:avisos@sgspe.test}
      subject-prefix: '[SGSPE] '

sgspe:
  territory:
    import:
      # RQ-SEC-020, ASM-050: tamaño del archivo, filas, plazo de lectura y validación, e importaciones a la vez (ImportProperties)
      # bytes (20 MB)
      max-bytes: 20971520
      max-rows: 10000
      timeout: 60s
      max-concurrent: 4
      # un ZIP de F6 (Shapefile, FileGDB, KMZ): entradas y bytes descomprimidos (200 MB) como máximo
      max-entries: 1000
      max-inflated-bytes: 209715200
      # la lectura con GDAL: listado de ogrinfo (4 MB), campos de la capa y sus nombres (bytes), GeoJSON de salida (64 MB)
      max-listing-bytes: 4194304
      max-fields: 200
      max-field-name-bytes: 16384
      max-geojson-bytes: 67108864
    layers:
      # tope de elementos por capa de GET /api/sgspe/territory/layers/{layer} (LayersProperties)
      max-features: 5000
    wms:
      # el proxy WMS (WmsProxy, security.md §10.2): plazo de GeoServer, tope de una imagen en memoria (bytes) y cuánto vale la
      # lista de capas publicadas que da la REST de GeoServer
      timeout: 5s
      max-bytes: 16777216
      published-ttl: 60s
    gdal:
      # GDAL de la importación y las exportaciones de F6 (ASM-127): la carpeta de ogrinfo y ogr2ogr (vacía: el PATH), la
      # versión mínima y el plazo de una exportación. sin GDAL, esos formatos responden 422 FORMAT_UNAVAILABLE
      path: ${SGSPE_GDAL_PATH:}
      min-version: '3.8'
      timeout: 60s
    queries:
      # límites de las consultas espaciales (especificación de F6 §3.1, ASM-126; TerritoryQueryProperties). fuera de rango,
      # 400 OUT_OF_RANGE. max-rows es el tope de filas de una consulta de la compuerta (limit), max-related el de conflictos
      # que nearby-conflicts lee con sus localidades
      min-buffer-m: 1
      max-buffer-m: 20000
      default-buffer-m: 500
      min-distance-km: 0.1
      max-distance-km: 50
      default-distance-km: 5
      max-rows: 5000
      max-period-years: 5
      max-related: 200
  exports:
    # tope de filas que una exportación lee de cada conjunto (StakeholderRegister): pasarse es 400 TOO_MANY_RECORDS
    max-rows: 20000
  map:
    # el mapa base (gis.md §6.4, RQ-GIS-013, MapSettings): un estilo de MapLibre por URL. en desarrollo, el de demostración de
    # MapLibre; por organización, el slug como clave; la atribución, por URL de estilo entre corchetes. nunca las teselas de
    # OpenStreetMap (su política de uso no lo admite)
    base-style-url: ${SGSPE_MAP_BASE_STYLE_URL:https://demotiles.maplibre.org/style.json}
    base-style-url-by-organization: {}
    attribution:
      '[https://demotiles.maplibre.org/style.json]': MapLibre
  calendar:
    # feriados nacionales por año (ASM-096, HolidayCalendar): el acuse de una queja cuenta días hábiles. un año se agrega
    # cuando se publica su lista oficial en El Peruano (D. Leg. 713 y sus modificatorias), con su clave entre comillas y
    # sus fechas; mientras falte, ese año usa lunes a viernes con una advertencia en el log (docs/develop/README.md §4).
    # los días no laborables del sector público no son feriados
    holidays:
      '2026':
        - 2026-01-01
        - 2026-04-02
        - 2026-04-03
        - 2026-05-01
        - 2026-06-07
        - 2026-06-29
        - 2026-07-23
        - 2026-07-28
        - 2026-07-29
        - 2026-08-06
        - 2026-08-30
        - 2026-10-08
        - 2026-11-01
        - 2026-12-08
        - 2026-12-09
        - 2026-12-25
      '2027':
        - 2027-01-01
        - 2027-03-25
        - 2027-03-26
        - 2027-05-01
        - 2027-06-07
        - 2027-06-29
        - 2027-07-23
        - 2027-07-28
        - 2027-07-29
        - 2027-08-06
        - 2027-08-30
        - 2027-10-08
        - 2027-11-01
        - 2027-12-08
        - 2027-12-09
        - 2027-12-25
  concurrency:
    # cuánto se guardan los saltos de versión de las escrituras de derivados (sgspe.derived_version, ADR-0027, ASM-091):
    # una versión leída hace más que esto, seguida de derivados, es 412. JOB-08 purga los vencidos
    derived-versions-retention: 7d
  stakeholder:
    # días en que dos evaluaciones con posturas distintas avisan STANCE_DIVERGENCE (CON-006)
    stance-divergence-days: 30
  jobs:
    # trabajos de fondo (JOB-01 DeadlineJob, JOB-02 DerivedFieldsJob, JOB-03 StakeholderFollowUpJob y JOB-08 RetentionJob).
    # false los apaga: las pruebas lo fijan en Gradle y llaman a runOnce
    enabled: ${SGSPE_JOBS_ENABLED:true}
    derived-fields:
      # cron de Spring (segundos primero), en America/Lima
      hourly-cron: '0 15 * * * *'
      daily-cron: '0 45 3 * * *'
    stakeholder-follow-up:
      # JOB-03, una vez al día
      cron: '0 30 4 * * *'
    deadline:
      # JOB-01, cada hora (ASM-006)
      cron: '0 5 * * * *'
    warning-rules:
      # JOB-04, cada hora (ASM-006, ASM-097): las alertas por regla
      cron: '0 25 * * * *'
    retention:
      # JOB-08, una vez al día: borra las claves de idempotencia vencidas (wasichai.idempotency.ttl) y los saltos de
      # derivados vencidos (sgspe.concurrency.derived-versions-retention)
      cron: '0 15 4 * * *'
  ai:
    # la IA viene apagada (ASM-015, ASM-128): los slugs de las organizaciones que la usan, separados por comas, los fija el operador
    # del despliegue junto con ANTHROPIC_API_KEY. activar o desactivar una organización pide redesplegar
    enabled-organizations: ${SGSPE_AI_ENABLED_ORGANIZATIONS:}
    # lo que queda en ai_interaction.provider (GAP-015)
    provider: anthropic
    # el modelo de cada caso (ASM-129): el más capaz del catálogo de Embabel 1.5.3 de AI-01 a AI-06 y Haiku 4.5 en AI-07 y AI-08.
    # AI-05 usa wasichai.agent.model
    models:
      ai-01: claude-opus-4-8
      ai-02: claude-opus-4-8
      ai-03: claude-opus-4-8
      ai-04: claude-opus-4-8
      ai-06: claude-opus-4-8
      ai-07: claude-haiku-4-5
      ai-08: claude-haiku-4-5
    # la versión en uso del prompt de cada caso (ai-architecture.md §10): volver atrás es cambiar este número
    prompts:
      ai-05: '1'
      ai-06: '1'
      ai-07: '1'
    limits:
      # ASM-131: caracteres de la fuente de una corrida, tokens de salida de una llamada, acciones de un agente (7.2b) y
      # caracteres de una pregunta al asistente
      input-chars: 200000
      output-tokens: 8192
      actions: 8
      question-chars: 4000
    knowledge:
      # el RAG de F7 (ai-architecture.md §13, ADR-0005 etapa 1; KnowledgeProperties): fragmentos de unos 1 500 caracteres con
      # 200 de solape; el texto (caracteres) y el archivo (bytes) que JOB-07 indexa de una evidencia; los fragmentos que la
      # búsqueda pide a la base antes de releer las evidencias y los que llegan al modelo
      chunk-chars: 1500
      overlap-chars: 200
      max-chars: 500000
      max-bytes: 20971520
      candidates: 25
      results: 5
    duplicates:
      # AI-07 (DuplicateProperties): registros de un objeto que una corrida lee (más es 400 TOO_MANY_RECORDS) y pares que
      # llegan al modelo
      max-records: 2000
      max-pairs: 20

embabel:
  agent:
    platform:
      action-qos:
        default:
          # ASM-131: una corrida corre dentro de la petición y tiene que terminar en un tiempo acotado. Embabel reintenta una
          # acción fallida hasta 5 veces con esperas de 10 s a 60 s (unos 3 minutos); aquí no se reintenta: una corrida sin
          # margen responde truncada y un filtro que falla, 500, en el acto (decisión 18 del plan 7.2a)
          max-attempts: 1

management:
  endpoint:
    health:
      # /actuator/health/liveness y /actuator/health/readiness, públicos en la cadena de wasichai (ADR-0026)
      probes:
        enabled: true
  health:
    mail:
      # el SMTP es un canal de entrega con reintentos (wasichai-notifications): si no responde, la app sigue sana
      enabled: false

logging:
  level:
    # los logs nunca llevan prompts, fragmentos ni respuestas (RQ-SEC-010, ai-architecture.md §12.4): de Embabel y de Spring AI,
    # solo avisos y errores
    com.embabel: WARN
    org.springframework.ai: WARN
