name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (ktlint + unit tests)
    runs-on: ubuntu-latest
    # packages: the wasichai libraries come from github packages (settings.gradle.kts reads GITHUB_ACTOR / GITHUB_TOKEN)
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    # a hung dependency download or gradle daemon must not burn the default 6 h
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # GDAL de la importación y las exportaciones de F6 (ASM-127): ogrinfo y ogr2ogr de gdal-bin, versión mínima 3.8 y los
      # drivers de la lista blanca. las unitarias de GDAL fallan sin él en la CI (GdalFixtures.requireGdal)
      - name: GDAL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gdal-bin
          ogrinfo --version
          set -- $(ogrinfo --version | sed -E 's/^GDAL ([0-9]+)\.([0-9]+).*/\1 \2/')
          if [ "$1" -lt 3 ] || { [ "$1" -eq 3 ] && [ "$2" -lt 8 ]; }; then echo "GDAL $1.$2 es menor que 3.8"; exit 1; fi
          for driver in 'ESRI Shapefile' KML GPKG OpenFileGDB GPX GeoJSON; do
            ogrinfo --formats | grep -q "^  $driver -" || { echo "falta el driver $driver"; exit 1; }
          done
      - name: Build
        run: ./gradlew build --no-daemon
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: build/reports/tests/

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    # packages: the wasichai libraries come from github packages (settings.gradle.kts reads GITHUB_ACTOR / GITHUB_TOKEN)
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # GDAL de la importación y las exportaciones de F6 (ASM-127): ogrinfo y ogr2ogr de gdal-bin, versión mínima 3.8 y los
      # drivers de la lista blanca. las unitarias de GDAL fallan sin él en la CI (GdalFixtures.requireGdal)
      - name: GDAL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gdal-bin
          ogrinfo --version
          set -- $(ogrinfo --version | sed -E 's/^GDAL ([0-9]+)\.([0-9]+).*/\1 \2/')
          if [ "$1" -lt 3 ] || { [ "$1" -eq 3 ] && [ "$2" -lt 8 ]; }; then echo "GDAL $1.$2 es menor que 3.8"; exit 1; fi
          for driver in 'ESRI Shapefile' KML GPKG OpenFileGDB GPX GeoJSON; do
            ogrinfo --formats | grep -q "^  $driver -" || { echo "falta el driver $driver"; exit 1; }
          done
      # SgspeApiTest provisions with model/*.py: the runner's python 3 (>= 3.11, stdlib only)
      - run: python3 --version
      # github runners have a local docker daemon: testcontainers starts postgis/postgis:18-3.6. no WASICHAI_TEST_DB_*
      # here, on purpose. pulling up front keeps the pull out of the container startup timeout
      - name: Pull database image
        run: docker pull -q postgis/postgis:18-3.6
      # ADR-0030: sgspe-latex construido desde develop/latex/Dockerfile, con las banderas de compose.yml, solo en el loopback
      # del runner. un paso y no un `services:`: la imagen se construye aquí
      - name: sgspe-latex
        run: |
          docker build -q -t sgspe-latex:ci develop/latex
          docker run -d --name sgspe-latex -p 127.0.0.1:8097:8080 --read-only --tmpfs /tmp:size=1g --cap-drop ALL \
            --security-opt no-new-privileges:true sgspe-latex:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8097/health > /dev/null; then exit 0; fi
            sleep 2
          done
          docker logs sgspe-latex
          exit 1
      - name: Integration tests
        run: ./gradlew integrationTest --no-daemon
        env:
          # las pruebas con la etiqueta latex fallan en la CI sin esta variable (LatexPdfTest)
          SGSPE_DELIVERABLE_LATEX_URL: http://127.0.0.1:8097
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-reports
          path: build/reports/tests/

  model:
    name: Model and roles (python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: model
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the runner's python 3 (>= 3.11, stdlib only): no setup-python to pin
      - run: python3 --version
      - run: python3 apply.py --validate-only
      - run: python3 apply_roles.py --dry-run > /dev/null
      - run: python3 publish_layers.py --validate-only
      - run: python3 load_ubigeo.py --dry-run
      - run: python3 -m unittest -v
      # el envoltorio de sgspe-latex se prueba sin TeX (ADR-0030)
      - run: python3 -m unittest -v
        working-directory: develop/latex

  slides:
    name: Slides (TypeScript and Remotion)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: slides
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: slides/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      # ADR-0031: las pruebas componen a PDF de verdad con el Chrome headless-shell de Remotion
      - run: npx remotion browser ensure
      - run: yarn test
        env:
          SLIDES_RENDER: '1'
      # la imagen de sgspe-slides con las banderas de compose.yml: compone la presentación de demostración por HTTP
      - name: sgspe-slides
        run: |
          docker build -q -t sgspe-slides:ci .
          docker run -d --name sgspe-slides -p 127.0.0.1:8099:8080 --read-only --tmpfs /tmp:size=1g \
            --tmpfs /dev/shm:size=512m --cap-drop ALL --security-opt no-new-privileges:true sgspe-slides:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8099/health > /dev/null; then break; fi
            sleep 2
          done
          status=$(curl -s -o /tmp/deck.pdf -w '%{http_code}' -H 'Content-Type: application/json' -H 'X-Trace: ci' \
            --data-binary @fixtures/demo-t1-direccion.json http://127.0.0.1:8099/render)
          docker logs sgspe-slides
          test "$status" = 200
          head -c 5 /tmp/deck.pdf | grep -q '%PDF-'

  traceability:
    name: Traceability (python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/check_traceability.py
      - run: python3 -m unittest discover -s tools -v

  format:
    name: Format (prettier)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: yarn
      - run: yarn install --frozen-lockfile
      # yaml and json; kotlin is ktlint's (build job), python and markdown keep their hand formatting
      - run: yarn format:check
