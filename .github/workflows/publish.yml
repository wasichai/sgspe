name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  jar:
    name: Executable jar
    runs-on: ubuntu-latest
    # contents: the jar is uploaded to the release. packages: the wasichai libraries come from github packages
    # (settings.gradle.kts reads GITHUB_ACTOR / GITHUB_TOKEN)
    permissions:
      contents: write
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    # a hung dependency download or gradle daemon must not burn the default 6 h
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # the version is the tag without the v. the jar is always build/libs/app.jar (build.gradle.kts)
      - name: Build the jar
        run: ./gradlew bootJar --no-daemon -Pversion="${GITHUB_REF_NAME#v}"
      - name: Attach the jar to the release
        run: |
          jar="$RUNNER_TEMP/sgspe-${GITHUB_REF_NAME#v}.jar"
          cp build/libs/app.jar "$jar"
          gh release upload "$GITHUB_REF_NAME" "$jar" --clobber --repo "$GITHUB_REPOSITORY"

  slides:
    name: Slides package
    runs-on: ubuntu-latest
    # ADR-0031: @wasichai/sgspe-slides (los layouts, los tokens y la especificación) con la versión del backend, que
    # release-please sube en slides/package.json; sgspe-ui lo usa con @remotion/player. packages: write, para publicarlo
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15
    defaults:
      run:
        working-directory: slides
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@wasichai'
      # el paquete tiene que tener la versión del release: si no, release-please no la subió y no se publica otra cosa
      - name: Check the version
        run: test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME#v}"
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
