name: sgspe

services:
  # postgis desde F1: instalar wasichai-gis en F2 solo crea la extensión, sin migrar datos (architecture.md §5.1).
  # los servicios de apoyo llegan con su fase: S3 (MinIO) y SMTP de prueba (Mailpit) en F3, GeoServer en F6 (abajo) y,
  # desde el 2026-10-19, sgspe-latex (antes, Gotenberg en F8)
  postgis:
    image: postgis/postgis:18-3.6
    container_name: sgspe-postgis
    environment:
      POSTGRES_USER: sgspe
      POSTGRES_PASSWORD: sgspe
      POSTGRES_DB: sgspe
    ports:
      # 5435, nunca 5432 ni 5434: son de otras apps del mismo entorno (ADR-0026).
      # solo loopback: con el DOCKER_HOST remoto esto abriría la base en la ip pública del VPS;
      # se llega por un túnel ssh (ssh -fN -L 5435:localhost:5435 "$SGSPE_VPS")
      - '127.0.0.1:${SGSPE_PG_PORT:-5435}:5432'
    volumes:
      # las imágenes de pg18 quieren el montaje un nivel más arriba; un volumen con nombre, nunca un bind mount
      - postgis-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sgspe -d sgspe']
      interval: 5s
      timeout: 5s
      retries: 20

  # F3, D1 (ADR-0014): el almacenamiento compatible con S3 de las evidencias (wasichai.files.store=s3), solo en
  # desarrollo por la licencia AGPL de MinIO (architecture.md §10.1). la bifurcación comunitaria, como srtm: minio ya no
  # publica minio/minio en docker hub
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: sgspe-minio
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      # solo para este MinIO local: la app los lee como WASICHAI_FILES_S3_ACCESS_KEY y WASICHAI_FILES_S3_SECRET_KEY
      MINIO_ROOT_USER: sgspe
      MINIO_ROOT_PASSWORD: sgspe-minio
    ports:
      # solo loopback, como postgis: la API y la consola, por túnel (ssh -fN -L 9095:localhost:9095 -L 9096:localhost:9096)
      - '127.0.0.1:${SGSPE_MINIO_PORT:-9095}:9000'
      - '127.0.0.1:${SGSPE_MINIO_CONSOLE_PORT:-9096}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # crea el bucket de las evidencias cuando MinIO responde, y termina. idempotente
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    container_name: sgspe-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command: ['mc alias set sgspe http://minio:9000 sgspe sgspe-minio && mc mb --ignore-existing sgspe/sgspe-evidencias']

  # F3, D2 (GAP-021): el SMTP de prueba del canal de correo de wasichai-notifications. no entrega nada: guarda cada
  # correo y lo muestra en su interfaz web
  mailpit:
    image: axllent/mailpit:v1.31.2
    container_name: sgspe-mailpit
    ports:
      # solo loopback, por túnel (ssh -fN -L 1029:localhost:1029 -L 8029:localhost:8029): SMTP y la interfaz web
      - '127.0.0.1:${SGSPE_SMTP_PORT:-1029}:1025'
      - '127.0.0.1:${SGSPE_MAILPIT_PORT:-8029}:8025'
    volumes:
      - mailpit-data:/data
    environment:
      # los correos sobreviven a un reinicio del contenedor, en el volumen con nombre
      MP_DATABASE: /data/mailpit.db

  # F6 (ADR-0015, security.md §10): publica las capas públicas de model/layers.json desde la misma base. nunca público:
  # solo loopback del VPS y sin CORS, porque el navegador nunca llega aquí (el portal pide las imágenes al proxy WMS de
  # SGSPE). lee PostGIS por la red del compose (postgis:5432) con el rol de solo lectura sgspe_geoserver (regla 6), que se
  # crea una vez; las capas y los estilos los publica model/publish_layers.py. la imagen no registra cuerpos de petición
  geoserver:
    image: docker.osgeo.org/geoserver:3.0.1
    container_name: sgspe-geoserver
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      # solo para este GeoServer local: la app y publish_layers.py los leen como WASICHAI_GIS_GEOSERVER_USERNAME y
      # WASICHAI_GIS_GEOSERVER_PASSWORD (develop/example.env)
      GEOSERVER_ADMIN_USER: sgspe
      GEOSERVER_ADMIN_PASSWORD: sgspe-geoserver
      SKIP_DEMO_DATA: 'true'
      INSTALL_EXTENSIONS: 'false'
      # el navegador nunca habla con GeoServer (gis.md §6.2)
      CORS_ENABLED: 'false'
    ports:
      # 8095: libre frente a las otras apps del entorno (8081 es el GeoServer de otras apps, 8082 a 8086 son de otras
      # apps; ADR-0026). solo loopback, por túnel (ssh -fN -L 8095:localhost:8095 "$SGSPE_VPS")
      - '127.0.0.1:${SGSPE_GEOSERVER_PORT:-8095}:8080'
    volumes:
      - geoserver-data:/opt/geoserver_data

  # desde el 2026-10-19 (ADR-0030, ASM-139): compone con LuaLaTeX el PDF de los entregables para JOB-05. imagen propia
  # (develop/latex/Dockerfile); nunca pública: solo loopback del VPS, por túnel (ssh -fN -L 8097:localhost:8097 "$SGSPE_VPS").
  # sistema de archivos de solo lectura con tmpfs en /tmp, sin capacidades ni privilegios nuevos, sin volúmenes. en
  # producción va en una red interna sin salida; aquí publica el puerto, que una red interna no permite
  latex:
    build: develop/latex
    image: sgspe-latex:local
    container_name: sgspe-latex
    read_only: true
    tmpfs:
      - /tmp:size=1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      LATEX_TIMEOUT: '170'
      LATEX_CONCURRENCY: '2'
    ports:
      - '127.0.0.1:${SGSPE_LATEX_PORT:-8097}:8080'

  # ADR-0031: sgspe-slides compone con Remotion (Chrome headless) el PDF de las presentaciones; solo lo llama JOB-09. sin
  # volúmenes, de solo lectura, con tmpfs en /tmp y /dev/shm (Chrome usa memoria compartida) y sin capacidades. como latex,
  # en desarrollo publica su puerto en el loopback; en producción va en una red interna sin salida
  slides:
    build: slides
    image: sgspe-slides:local
    container_name: sgspe-slides
    read_only: true
    tmpfs:
      - /tmp:size=1g
      - /dev/shm:size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SLIDES_TIMEOUT: '170'
      SLIDES_CONCURRENCY: '2'
    ports:
      - '127.0.0.1:${SGSPE_SLIDES_PORT:-8099}:8080'

volumes:
  postgis-data:
  minio-data:
  mailpit-data:
  geoserver-data:
